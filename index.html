<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포렌식 쇼츠 지도</title>
<style>
:root{
  --bg:#0f1318; --panel:#171d25; --line:#2a3340; --text:#e8edf3; --sub:#8b98a8;
  --gold:#d9b25f; --done:#4cc38a; --made:#5aa9f0; --mock:#c9a24a; --plan:#5b6675;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f1ea; --panel:#fff; --line:#d9d3c5; --text:#1d2430; --sub:#667385;
         --gold:#a87a1c; --done:#1c8f5a; --made:#2272c4; --mock:#a87a1c; --plan:#98a2b0; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Malgun Gothic",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:grid;
     grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media (max-width:900px){ main{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){ main{grid-template-columns:1fr} }
.col h2{margin:0 0 8px;font-size:14px;letter-spacing:.08em;color:var(--gold);
        border-bottom:2px solid var(--gold);padding-bottom:4px;display:flex;justify-content:space-between}
.col h2 small{color:var(--sub);font-weight:normal;letter-spacing:0}
.node{position:relative;width:100%;text-align:left;background:var(--panel);color:inherit;
      border:1px solid var(--line);border-left:5px solid var(--plan);border-radius:8px;
      padding:5px 32px 5px 10px;margin-bottom:5px;cursor:pointer;font:inherit}
.node:hover,.node.sel{border-color:var(--gold);border-left-color:var(--st,var(--plan))}
.node.sub{margin-left:16px;width:calc(100% - 16px)}
.node.sub .ti{font-weight:600;font-size:13px}
.node .row{display:flex;gap:7px;align-items:baseline}
.node .no{font-size:11px;color:var(--sub);white-space:nowrap}
.node .ti{font-weight:700;font-size:14px}
.dots{display:flex;gap:4px;margin:2px 0 6px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots b.on{background:var(--gold)}
.node .go{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;
          border-radius:50%;display:grid;place-items:center;background:var(--done);color:#fff;
          text-decoration:none;font-size:11px}
a.chip,.chip.deep{border-color:var(--st,var(--gold));text-decoration:none;color:var(--text)}
.chip.deep::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st);margin-right:5px}
.chip.dim{color:var(--sub)}
#deep{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
#deep h2{margin:0 0 6px;font-size:14px;color:var(--gold);letter-spacing:.08em}
#deep p{margin:0;color:var(--sub);font-size:12px}
#detail{position:sticky;bottom:0;grid-column:1/-1;background:var(--panel);border:1px solid var(--gold);
        border-radius:10px;padding:14px 16px;display:none}
#detail.show{display:block}
#detail h3{margin:0 0 2px}
#detail .meta{color:var(--sub);font-size:12px;margin-bottom:8px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 9px;margin:2px 3px 2px 0;font-size:12px}
.btn{display:inline-block;margin-top:8px;background:var(--done);color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;font-weight:700}
.btn.off{background:var(--plan);cursor:default}
</style>
</head>
<body>
<header>
  <h1 id="h-series">포렌식 쇼츠 지도</h1>
  <p id="h-sub"></p>
  <div class="legend" id="legend"></div>
</header>
<main id="map"></main>
<script>
const STATUS = {
  "구상": "var(--plan)", "목업": "var(--mock)", "제작": "var(--made)", "공개": "var(--done)"
};
const PARTS = ["획득", "분석", "복구", "종합"];
const PR = ["정당성", "무결성", "재현", "신속성", "연계보관성"];
const $ = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const norm = t => String(t || "").toLowerCase().replace(/\s+/g, "");
const safeUrl = u => /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(u || "") ? u : "";

fetch("series.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(err => {
  document.getElementById("h-sub").textContent =
    "series.json을 읽지 못했습니다. 폴더에서 '미리보기.bat'로 열어 주세요. (" + err.message + ")";
});

function render(db){
  document.getElementById("h-series").textContent = db.channel + " · " + db.series;
  const eps = db.episodes;
  const pub = eps.filter(e => safeUrl(e.youtube)).length;
  document.getElementById("h-sub").textContent = db.public ? `공개된 영상 ${eps.length}편` : `전체 ${eps.length}편 중 영상 링크 ${pub}편`;
  const lg = document.getElementById("legend");
  for (const [k, v] of Object.entries(STATUS)){
    if (db.public) break;
    const s = $("span"); const i = $("i"); i.style.background = v; s.append(i, k); lg.append(s);
  }

  const map = document.getElementById("map");
  const detail = $("div"); detail.id = "detail";
  let selNode = null;

  for (const part of PARTS){
    const list = eps.filter(e => e.part === part);
    if (db.public && !list.length) continue;
    const col = $("section", "col");
    const h = $("h2", "", part); h.append($("small", "", list.length + "편"));
    col.append(h);
    for (const e of list){
      const sub = e.no.includes("-");
      const n = $("button", "node" + (sub ? " sub" : ""));
      n.style.setProperty("--st", STATUS[e.status] || STATUS["구상"]);
      n.style.borderLeftColor = STATUS[e.status] || STATUS["구상"];
      const row = $("div", "row"); row.append($("span", "no", sub ? e.no : `${part} ${e.no}`), $("span", "ti", e.title));
      n.append(row);
      const url = safeUrl(e.youtube);
      if (url){
        const a = $("a", "go", "▶"); a.href = url; a.target = "_blank"; a.rel = "noopener";
        a.title = "유튜브에서 보기"; a.addEventListener("click", ev => ev.stopPropagation());
        n.append(a);
      }
      n.addEventListener("click", () => {
        if (selNode) selNode.classList.remove("sel");
        selNode = n; n.classList.add("sel"); show(e);
      });
      col.append(n);
    }
    map.append(col);
  }
  map.append(detail);

  const deepBy = new Map((db.deep || []).map(d => [norm(d.keyword), d]));
  function chipEl(c){
    const d = deepBy.get(norm(c));
    if (!d) return $("span", "chip dim", c);
    const url = safeUrl(d.youtube);
    const el = $(url ? "a" : "span", "chip deep", c);
    el.style.setProperty("--st", STATUS[d.status] || STATUS["구상"]);
    el.title = `심화편: ${d.title || d.keyword} (${d.status})`;
    if (url){ el.href = url; el.target = "_blank"; el.rel = "noopener"; }
    return el;
  }
  if ((db.deep || []).length){
    const box = $("section"); box.id = "deep";
    box.append($("h2", "", `심화편 키워드 색인 · ${db.deep.length}편`),
               $("p", "", "본편 칩과 글자가 같으면 자동 연결됩니다. 영상이 있으면 눌러서 이동합니다."));
    const w = $("div"); for (const d of db.deep) w.append(chipEl(d.keyword)); box.append(w);
    map.insertBefore(box, detail);
  }

  function show(e){
    detail.replaceChildren();
    detail.append($("h3", "", `${e.part} ${e.no}편 · ${e.title}`));
    detail.append($("div", "meta", `상태: ${e.status}` + (e.heading ? ` · ${e.heading}` : "")));
    if (e.principles && e.principles.length){
      const d = $("div", "dots"); d.title = "점등 원칙: " + e.principles.join(" · ");
      for (const p of PR){ const b = $("b", e.principles.includes(p) ? "on" : ""); b.title = p; d.append(b); }
      detail.append(d, $("div", "meta", "점등 원칙: " + e.principles.join(" · ")));
    }
    if (e.chips && e.chips.length){
      const w = $("div"); for (const c of [...new Set(e.chips)]) w.append(chipEl(c)); detail.append(w);
    }
    if (e.note) detail.append($("p", "", e.note));
    const url = safeUrl(e.youtube);
    const b = $("a", "btn" + (url ? "" : " off"), url ? "▶ 유튜브에서 보기" : "영상 링크 없음");
    if (url){ b.href = url; b.target = "_blank"; b.rel = "noopener"; }
    detail.append(b);
    detail.classList.add("show");
  }
}
</script>
</body>
</html>
